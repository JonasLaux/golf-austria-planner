name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit tracked files for private data
        run: python scripts/check_public_tree.py --ref HEAD

      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build --wheel
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[dev]"
          python -m pip check

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Test installed package without a browser or credentials
        shell: bash
        run: |
          test_directory="$(mktemp -d)"
          cp -R tests "$test_directory/tests"
          mkdir "$test_directory/scripts"
          cp scripts/check_public_tree.py "$test_directory/scripts/"
          cd "$test_directory"
          python -m unittest discover -s tests -v
          golf --help
          python - <<'PY'
          from pathlib import Path

          import golf_austria
          from golf_austria.portal import DEFAULT_CLUBS, configured_clubs

          package_directory = Path(golf_austria.__file__).resolve().parent
          assert "site-packages" in package_directory.parts, "The source checkout shadowed the installed wheel."
          assert Path(DEFAULT_CLUBS).resolve().is_relative_to(package_directory), "Default clubs must come from package data."
          assert configured_clubs(), "The installed wheel must include its default club configuration."
          print("Installed wheel loads its bundled club configuration outside the checkout.")
          PY
