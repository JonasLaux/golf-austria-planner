name: Bug report
description: Report a reproducible problem without sharing account data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic examples. Do not attach cookies, browser profiles,
        tee-sheet screenshots, raw authenticated HTML, or other golfers' details.
        For vulnerabilities, see SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the command, replacing any personal values.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal synthetic fixture is ideal. Public club URLs are useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Linux distribution, Python version, browser version, commit/version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed credentials, session state and personal tee-sheet data from this report.
          required: true
