name: Feature request
description: Suggest a workflow improvement or another booking provider.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: For integrations, include public documentation or club URLs, never login details.
