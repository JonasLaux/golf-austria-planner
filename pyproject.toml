[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "golf-austria-planner"
version = "0.1.0"
description = "Local Golf Austria tee-time lookup and whole-round weather planning"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "JonasLaux"}]
keywords = ["golf", "weather", "tee-times", "austria", "cli", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["playwright==1.65.2"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff==0.17.5"]

[project.urls]
Repository = "https://github.com/JonasLaux/golf-austria-planner"
Issues = "https://github.com/JonasLaux/golf-austria-planner/issues"

[project.scripts]
golf = "golf_austria.cli:main"

[tool.setuptools.packages.find]
include = ["golf_austria*"]

[tool.setuptools.package-data]
golf_austria = ["data/clubs.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
